name: enigma2-debian12-arm64

# openATV enigma2 (master) -> Debian 12 (bookworm) arm64，原生 arm64 runner 构建，产出 .deb
on:
  workflow_dispatch:
    inputs:
      boxtype:
        description: "enigma2 BOXTYPE (configure --with-boxtype)"
        default: "u5"
      machinebuild:
        description: "enigma2 MACHINEBUILD (configure --with-machinebuild)"
        default: "u5"
  push:
    paths:
      - ".github/workflows/enigma2.yml"
      - "packaging/**"
  schedule:
    - cron: "0 4 * * 1" # 每周一 UTC 04:00 跟踪上游 master

jobs:
  enigma2:
    runs-on: ubuntu-24.04-arm
    container: debian:12
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      BOXTYPE: ${{ github.event.inputs.boxtype || 'u5' }}
      MACHINEBUILD: ${{ github.event.inputs.machinebuild || 'u5' }}
      E2VER: 8.0.dvbip1002.${{ github.run_number }}

    steps:
      - name: Install build deps (Debian 12)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential autoconf automake autoconf-archive libtool pkg-config \
            gettext bison flex swig git curl ca-certificates xz-utils \
            doxygen graphviz xsltproc \
            python3 python3-dev python3-setuptools \
            meson ninja-build \
            libglib2.0-dev libfreetype-dev libfribidi-dev libpng-dev libxml2-dev \
            libssl-dev libcurl4-openssl-dev libavahi-client-dev \
            libjpeg-dev libgif-dev libwebp-dev libswscale-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev libffi-dev \
            liblzma-dev libncursesw5-dev uuid-dev \
            libasound2-dev libdrm-dev

      # ---- Python 3.13：enigma2 master 已全面采用 PEP 701 f-string 语法（>300 处），
      #      Debian 12 的 python3.11 无法解析，必须自带新解释器 ----

      - name: Build Python 3.13 (master requires PEP 701 syntax)
        run: |
          PYVER=3.13.18
          curl -fsSL -o /tmp/py.tgz "https://www.python.org/ftp/python/${PYVER}/Python-${PYVER}.tgz"
          tar xzf /tmp/py.tgz -C /tmp
          cd /tmp/Python-${PYVER}
          ./configure --prefix=/usr/local --enable-shared --with-ensurepip=install \
            >/dev/null
          make -j$(nproc) >/dev/null
          make altinstall >/dev/null
          ldconfig
          /usr/local/bin/python3.13 --version

      # ---- Debian 12 缺失的依赖：源码补编 ----

      - name: Build sigc++-3.x (not in bookworm)
        run: |
          git clone --depth 1 --branch 3.2.0 https://github.com/libsigcplusplus/libsigcplusplus.git /tmp/sigc
          cd /tmp/sigc
          meson setup build --prefix=/usr -Dbuild-examples=false -Dbuild-documentation=false
          ninja -C build install
          ldconfig

      - name: Build libdvbsi++ (OpenVisionE2)
        run: |
          git clone --depth 1 https://github.com/OpenVisionE2/libdvbsi.git /tmp/libdvbsi
          cd /tmp/libdvbsi
          ./autogen.sh
          ./configure --prefix=/usr
          make -j$(nproc) install
          # staging：供后续打包 libdvbsi++ 运行库 .deb
          make install DESTDIR=$GITHUB_WORKSPACE/.pkg-libdvbsi
          ldconfig

      - name: Build libtuxtxt (OpenPLi, provides tuxbox-tuxtxt)
        run: |
          # openATV enigma2 配套的是 OE-A fork（提供 tuxtxt_enabledebug 等符号），非 OpenPLi 版
          git clone --depth 1 https://github.com/oe-alliance/tuxtxt.git /tmp/tuxtxt
          cd /tmp/tuxtxt/libtuxtxt
          # libtuxtxt 需要 tuxbox-cvs 的头文件：libtuxbox/tuxbox.h + driver/include/tuxbox/*（header-only）
          curl -fsSL -o /usr/include/tuxbox.h \
            https://raw.githubusercontent.com/OpenPLi/OpenPLi-1/master/cdk/apps/tuxbox/libtuxbox/tuxbox.h
          mkdir -p /usr/include/tuxbox
          for f in hardware_dbox2.h hardware_dreambox.h hardware_pci.h info.h info_dbox2.h kernel.h; do
            curl -fsSL -o /usr/include/tuxbox/$f \
              https://raw.githubusercontent.com/OpenPLi/OpenPLi-1/master/cdk/driver/include/tuxbox/$f
          done
          autoreconf -fi
          # tuxbox 宏的 DVB_API_VERSION cpp 提取在容器内失败，直接注入版本跳过检测
          DVB_API_VERSION=5 ./configure --prefix=/usr
          make -j$(nproc) install
          # staging：供后续打包 libtuxtxt 运行库 .deb
          make install DESTDIR=$GITHUB_WORKSPACE/.pkg-libtuxtxt
          ldconfig
          pkg-config --modversion tuxbox-tuxtxt

      - name: Sync DVB uapi headers with target kernel (6.12.y)
        run: |
          # Debian 12 的 linux-libc-dev(6.1) 缺 SYS_DVBC2 等，用目标内核 HiSilicon linux-6.12.y 的 uapi 头覆盖
          for f in audio.h ca.h dmx.h frontend.h net.h osd.h version.h video.h; do
            curl -fsSL -o /usr/include/linux/dvb/$f \
              https://raw.githubusercontent.com/HiSilicon-Development/linux-6.12.y/main/include/uapi/linux/dvb/$f
          done
          # 原始 uapi 头含内核态注解 __user，等价 headers_install 剥离
          sed -i 's/\b__user\b//g' /usr/include/linux/dvb/*.h

      - name: Build libtuxtxt32bpp (OpenPLi, enigma2 links -ltuxtxt32bpp)
        run: |
          cd /tmp/tuxtxt/tuxtxt
          autoreconf -fi
          # generic：避免默认 dbox2 定义 HAVE_DBOX_HARDWARE（无 avstable 声明，编译失败）
          DVB_API_VERSION=5 ./configure --prefix=/usr --with-boxtype=generic
          make -j$(nproc) install
          # libtuxtxt32bpp 并入 libtuxtxt 运行库包
          make install DESTDIR=$GITHUB_WORKSPACE/.pkg-libtuxtxt
          ldconfig
          ls -la /usr/lib/libtuxtxt*

      # ---- enigma2 本体 ----

      # 先 checkout 本仓库到 workspace 根（packaging/enigma.info 等打包资源在此），
      # openatv/enigma2 再 checkout 到 enigma2/ 子目录，两者不冲突
      - name: Checkout this repo (packaging files)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout enigma2 (openatv master)
        uses: actions/checkout@v4
        with:
          repository: openatv/enigma2
          ref: master
          fetch-depth: 1
          path: enigma2

      - name: Apply Debian 12 compat patches
        run: |
          cd enigma2
          # glibc < 2.38 无 strlcpy（OE/musl 有），注入兼容 shim
          python3 - <<'EOF'
          p = 'hotplug/hotplug.c'
          s = open(p).read()
          if 'e2_strlcpy' not in s:
              compat = '''#include <features.h>
          #include <string.h>
          #if defined(__GLIBC__) && !__GLIBC_PREREQ(2,38)
          #define strlcpy(d, s, z) e2_strlcpy(d, s, z)
          static inline size_t e2_strlcpy(char *dst, const char *src, size_t size) {
          	size_t len = strlen(src);
          	if (size) { size_t n = (len >= size) ? size - 1 : len; memcpy(dst, src, n); dst[n] = 0; }
          	return len;
          }
          #endif
          '''
              open(p, 'w').write(compat + s)
              print('strlcpy shim injected')
          else:
              print('shim already present')

          # lib/gdi/fb.cpp SetMode: FBIOPUT_VSCREENINFO 失败时原码直接 return -1，
          # 跳过了后面的 stride=fix.line_length 赋值 → stride 恒为 0 → gFBDC 按
          # y*stride 算偏移整屏坍缩 → 黑屏。DVBIP-1002 的 histb-vdpdrmfb（DRM
          # fbdev 仿真）连单缓冲同参数 PUT 都回 EINVAL，但默认模式就是
          # 1280x720x32 可直接用。改为失败不 return，保留当前模式继续，
          # 让 stride 从 FBIOGET_FSCREENINFO 正常取得。
          p = 'lib/gdi/fb.cpp'
          s = open(p).read()
          old = ('\t\t\teDebug("[fb] FBIOPUT_VSCREENINFO %m");\n'
                 '\t\t\treturn -1;\n'
                 '\t\t}\n'
                 '\t\teDebug("[fb] double buffering not available.");\n'
                 '\t}\n'
                 '\telse\n'
                 '\t\teDebug("[fb] double buffering available!");')
          new = ('\t\t\teDebug("[fb] FBIOPUT_VSCREENINFO %m (keep current mode)");\n'
                 '\t\t}\n'
                 '\t\teDebug("[fb] double buffering not available.");\n'
                 '\t}\n'
                 '\telse\n'
                 '\t\teDebug("[fb] double buffering available!");')
          if old in s:
              open(p, 'w').write(s.replace(old, new, 1))
              print('fb.cpp SetMode fallback patched')
          elif '(keep current mode)' in s:
              print('fb.cpp SetMode fallback already patched')
          else:
              raise SystemExit('fb.cpp anchor not found - upstream changed, review needed')

          # AVSwitch.getModeList: DVBIP-1002 的 /proc/stb/video/* 节点全缺时
          # 向导 port=None，`self.modes[port]` 直接 KeyError 把 WizardVideo
          # 炸死（2026-10-29 盒子实测）。改为缺端口返回空列表，向导可走完。
          p = 'lib/python/Components/AVSwitch.py'
          s = open(p).read()
          old = 'for mode in self.modes[port]:'
          new = 'for mode in self.modes.get(port, []):'
          if old in s:
              open(p, 'w').write(s.replace(old, new, 1))
              print('AVSwitch.getModeList KeyError guard patched')
          elif new in s:
              print('AVSwitch.getModeList already patched')
          else:
              raise SystemExit('AVSwitch.py anchor not found - upstream changed, review needed')

          # main/enigma.cpp: 盒子 Debian 无 glibc UTF-8 locale，内嵌 Python
          # locale 回退 POSIX → open() 默认 ascii → fileReadLines 读自带
          # groupedservices（含 UTF-8 字节）时 UnicodeDecodeError，InfoBar
          # 启动即 exit 5（2026-10-29 盒子实测）。强制 PYTHONUTF8=1
          # （PEP 540 UTF-8 模式），open()/stdio 默认 UTF-8，等同 OE 镜像
          # 有真实 UTF-8 locale 的效果。
          p = 'main/enigma.cpp'
          s = open(p).read()
          old = '\tsetenv("PYTHONPATH", eEnv::resolve("${libdir}/enigma2/python").c_str(), 0);\n'
          new = (old
                 + '\t// Force Python UTF-8 mode: host lacks glibc UTF-8 locales,\n'
                   '\t// so open() would default to ascii and crash on UTF-8 data files.\n'
                   '\tsetenv("PYTHONUTF8", "1", 1);\n')
          if old in s:
              open(p, 'w').write(s.replace(old, new, 1))
              print('enigma.cpp PYTHONUTF8 patched')
          elif 'PYTHONUTF8' in s:
              print('enigma.cpp already patched')
          else:
              raise SystemExit('enigma.cpp anchor not found - upstream changed, review needed')

          # Components/International.py：语言设置界面（LocaleSelection.
          # updateLocaleList）遍历 getAvailablePackages()=DEFINED_LOCALES
          # 静态全量清单（OE“语言商店”设计，列出全部可在线安装语言，
          # control 文件只决定已安装标记），所以裁 po/control 不影响列表。
          # 盒子无 opkg 生态，直接把清单裁成英语/简中/繁中；
          # PERMANENT_LOCALES 的 de_DE 一并去掉（避免德语被当作永久已装）。
          p = 'lib/python/Components/International.py'
          s = open(p).read()
          import re
          s2 = re.sub(r'\tDEFINED_LOCALES = \[.*?\]\n',
                      '\tDEFINED_LOCALES = ["en", "zh-cn", "zh-hk"]\n', s, count=1)
          s2 = re.sub(r'\tPERMANENT_LOCALES = \[.*?\]\n',
                      '\tPERMANENT_LOCALES = ["en_US"]\n', s2, count=1)
          if s2 == s:
              raise SystemExit('International.py anchors not found - upstream changed, review needed')
          open(p, 'w').write(s2)
          print('International.py DEFINED_LOCALES/PERMANENT_LOCALES pruned')

          # Tools/Directories.py：所有文本读写不指定编码，跟随 locale 默认值。
          # 盒子无 glibc UTF-8 locale 时 Python 退回 ascii，自带数据文件
          # （groupedservices 等）含 UTF-8 字节即 UnicodeDecodeError →
          # InfoBar 启动 exit 5。实测 PYTHONUTF8=1 环境变量在嵌入式解释器上
          # 不稳定（run35 有效、run37 复崩），改为读写全部显式 UTF-8（确定性）。
          p = 'lib/python/Tools/Directories.py'
          s = open(p).read()
          replacements = [
              ('with open(filename) as fd:', 'with open(filename, encoding="utf-8") as fd:'),
              ('with open(filename, "w") as fd:', 'with open(filename, "w", encoding="utf-8") as fd:'),
          ]
          count = 0
          for old, new in replacements:
              count += s.count(old)
              s = s.replace(old, new)
          if count < 5:
              raise SystemExit(f'Directories.py open anchors: expected >=5, got {count} - upstream changed, review needed')
          open(p, 'w').write(s)
          print(f'Directories.py: {count} open() calls pinned to utf-8')

          # Components/NimManager.py：调谐器枚举唯一数据源是
          # /proc/bus/nim_sockets（Dreambox 专有接口，由各厂商私有驱动提供）。
          # Hi3798CV200 mainline DVB 驱动（histb-dmx + mxl214，4x DVB-C）
          # 只注册标准 /dev/dvb/adapterN/frontend0，无任何 proc 文件 →
          # 调谐器列表为空（2026-10-30 盒子实测）。补回退枚举：
          # /proc/bus/nim_sockets 缺失时用 ctypes FE_GET_INFO 扫描
          # /dev/dvb/adapter*/frontend0，entries 与 proc 解析格式一致，
          # 复用同一段 NIM 构建管线（late-slot/fbc/input_name 逻辑不变）。
          p = 'lib/python/Components/NimManager.py'
          s = open(p).read()
          old = ('\t\ttry:\n'
                 '\t\t\tnimfile = open("/proc/bus/nim_sockets")\n'
                 '\t\texcept OSError:\n'
                 '\t\t\treturn\n'
                 '\t\tcurrent_slot = None\n'
                 '\t\tentries = {}\n'
                 '\t\tfor line in nimfile:\n')
          new = ('\t\tentries = self.enumDevDvbFrontends()\n'
                 '\t\tif entries is None:\n'
                 '\t\t\ttry:\n'
                 '\t\t\t\tnimfile = open("/proc/bus/nim_sockets")\n'
                 '\t\t\texcept OSError:\n'
                 '\t\t\t\treturn\n'
                 '\t\t\tentries = {}\n'
                 '\t\tcurrent_slot = None\n'
                 '\t\tfor line in nimfile if entries is None else []:\n')
          old_close = '\t\tnimfile.close()\n'
          new_close = '\t\tif entries is None:\n\t\t\tnimfile.close()\n'
          if old not in s and 'enumDevDvbFrontends' not in s:
              raise SystemExit('NimManager.py enumerateNIMs anchor not found - upstream changed, review needed')
          if old in s:
              s = s.replace(old, new, 1)
              if s.count(old_close) != 1:
                  raise SystemExit('NimManager.py nimfile.close anchor not unique - upstream changed, review needed')
              s = s.replace(old_close, new_close, 1)
              anchor = '\tdef enumerateNIMs(self):\n'
              if s.count(anchor) != 1:
                  raise SystemExit('NimManager.py method anchor not unique - upstream changed, review needed')
              method = '''
          	def enumDevDvbFrontends(self):
          		# Hi3798CV200: mainline DVB drivers (histb-dmx + mxl214) expose only
          		# standard /dev/dvb/adapterN/frontend0 and no /proc/bus/nim_sockets
          		# (dreambox-centric interface no mainline driver provides). Enumerate
          		# frontends via FE_GET_INFO and return entries in the same format the
          		# /proc parser produces. Returns None when the proc file exists so it
          		# keeps priority.
          		if exists("/proc/bus/nim_sockets"):
          			return None
          		if not exists("/dev/dvb"):
          			return {}
          		import ctypes
          		import fcntl
          		import os

          		class FrontendInfo(ctypes.Structure):
          			_fields_ = [
          				("name", ctypes.c_char * 128),
          				("type", ctypes.c_int),
          				("frequency_min", ctypes.c_uint32),
          				("frequency_max", ctypes.c_uint32),
          				("frequency_stepsize", ctypes.c_uint32),
          				("frequency_tolerance", ctypes.c_uint32),
          				("symbol_rate_min", ctypes.c_uint32),
          				("symbol_rate_max", ctypes.c_uint32),
          				("symbol_rate_tolerance", ctypes.c_uint32),
          				("notifier_delay", ctypes.c_uint32),
          				("caps", ctypes.c_uint32),
          			]

          		FE_GET_INFO = 0x80A86F3D  # _IOR('o', 61, struct dvb_frontend_info)
          		typeMap = {0: "DVB-S", 1: "DVB-C", 2: "DVB-T", 3: "ATSC"}
          		entries = {}
          		frontendIndex = 0
          		for adapter in sorted(os.listdir("/dev/dvb")):
          			if not adapter.startswith("adapter"):
          				continue
          			fePath = join("/dev/dvb", adapter, "frontend0")
          			if not exists(fePath):
          				continue
          			try:
          				fd = os.open(fePath, os.O_RDONLY)
          				try:
          					info = FrontendInfo()
          					fcntl.ioctl(fd, FE_GET_INFO, info)
          				finally:
          					os.close(fd)
          				feType = typeMap.get(info.type)
          				if feType is None:
          					print(f"[NimManager] {fePath}: unsupported FE type {info.type}, skipped")
          					continue
          				feName = info.name.decode("utf-8", "replace").strip() or fePath
          				entries[frontendIndex] = {
          					"type": feType,
          					"name": feName,
          					"isempty": False,
          					"frontend_device": frontendIndex,
          				}
          				print(f"[NimManager] fallback NIM scan: slot {frontendIndex} '{feName}' ({feType})")
          				frontendIndex += 1
          			except Exception as err:
          				print(f"[NimManager] fallback NIM scan failed on {fePath}: {err}")
          		return entries

          	def enumerateNIMs(self):
          '''
              s = s.replace(anchor, method, 1)
              open(p, 'w').write(s)
          print('NimManager.py /dev/dvb fallback NIM enumeration patched')

          # Screens/Information.py:1357 信息界面硬编码 Popen("/usr/bin/opkg",
          # "list-installed")——Debian 盒子无 opkg，直接 FileNotFoundError 崩溃
          # （2026-10-30 盒子实测）。opkg 缺失时回退 dpkg-query，输出格式对齐
          # opkg 的 "pkg - version"（findPackageRevision 按 "-" 切分逻辑不变）；
          # 两者都没有则显示 "not found" 而非崩溃。
          p = 'lib/python/Screens/Information.py'
          s = open(p).read()
          old = ('\t\t\tprocess = Popen(("/usr/bin/opkg", "list-installed"), stdout=PIPE, stderr=PIPE, universal_newlines=True)\n'
                 '\t\t\tstdout, stderr = process.communicate()\n'
                 '\t\t\tif process.returncode == 0:\n')
          new = ('\t\t\tif isfile("/usr/bin/opkg"):\n'
                 '\t\t\t\tprocess = Popen(("/usr/bin/opkg", "list-installed"), stdout=PIPE, stderr=PIPE, universal_newlines=True)\n'
                 '\t\t\t\tstdout, stderr = process.communicate()\n'
                 '\t\t\telif isfile("/usr/bin/dpkg-query"):\n'
                 '\t\t\t\t# Debian box: no opkg; dpkg-query with opkg-style output ("pkg - version").\n'
                 '\t\t\t\tprocess = Popen(("/usr/bin/dpkg-query", "-W", "-f=${binary:Package} - ${Version}\\n"), stdout=PIPE, stderr=PIPE, universal_newlines=True)\n'
                 '\t\t\t\tstdout, stderr = process.communicate()\n'
                 '\t\t\telse:\n'
                 '\t\t\t\tprocess = None\n'
                 '\t\t\t\tstdout, stderr = "", ""\n'
                 '\t\t\tif process and process.returncode == 0:\n')
          if old in s:
              open(p, 'w').write(s.replace(old, new, 1))
          elif 'dpkg-query' in s:
              print('Information.py already patched')
          else:
              raise SystemExit('Information.py opkg anchor not found - upstream changed, review needed')
          print('Information.py opkg->dpkg-query fallback patched')

          # Screens/SoftwareUpdate.py:214 无 opkg 时 getFetchedList 返回短元组，
          # fetched[1] 直接 IndexError → FATAL SIGNAL（2026-10-30 盒子实测）。
          # 跳过字段不足的条目，界面落入 noupdate/error 状态而非崩溃。
          p = 'lib/python/Screens/SoftwareUpdate.py'
          s = open(p).read()
          old = ('\t\t\t\t\tfor fetched in fetchedList:\n'
                 '\t\t\t\t\t\toldVer = fetched[1] if fetched[1] else _("Current version unknown")\n')
          new = ('\t\t\t\t\tfor fetched in fetchedList:\n'
                 '\t\t\t\t\t\tif len(fetched) < 3:\n'
                 '\t\t\t\t\t\t\tcontinue\n'
                 '\t\t\t\t\t\toldVer = fetched[1] if fetched[1] else _("Current version unknown")\n')
          if old in s:
              open(p, 'w').write(s.replace(old, new, 1))
          elif 'len(fetched) < 3' in s:
              print('SoftwareUpdate.py already patched')
          else:
              raise SystemExit('SoftwareUpdate.py anchor not found - upstream changed, review needed')
          print('SoftwareUpdate.py short-tuple guard patched')

          # Components/Converter/FrontendInfo.py：getText 对 LOCK/SLOT_NUMBER
          # 类型断言失败。stock skin_default 的 Satfinder/ScanSetup 用
          # Pixmap renderer + FrontendInfo>LOCK + ConditionalShowHide 组合，
          # Pixmap.changed() 的 hasattr(self.source, "text") 会穿透
          # ConditionalShowHide.__getattr__ 求值 text property → 断言抛出
          # → 打开 Satfinder 直接 BSOD（2026-10-30 盒子实测）。
          # lock/slot-number 没有有意义的文本形态，返回空串即可。
          p = 'lib/python/Components/Converter/FrontendInfo.py'
          s = open(p).read()
          old = '\t\tassert self.type not in (self.LOCK, self.SLOT_NUMBER), "the text output of FrontendInfo cannot be used for lock info"\n'
          new = ('\t\tif self.type in (self.LOCK, self.SLOT_NUMBER):\n'
                 '\t\t\t# No meaningful text form for lock/slot-number. The stock\n'
                 '\t\t\t# skin_default attaches Pixmap renderers to FrontendInfo>LOCK\n'
                 '\t\t\t# conversions; Pixmap.changed() probes hasattr(source, "text")\n'
                 '\t\t\t# which evaluates this property - raising here BSODs Satfinder.\n'
                 '\t\t\treturn ""\n')
          if old in s:
              open(p, 'w').write(s.replace(old, new, 1))
          elif 'No meaningful text form for lock/slot-number' in s:
              print('FrontendInfo.py already patched')
          else:
              raise SystemExit('FrontendInfo.py anchor not found - upstream changed, review needed')
          print('FrontendInfo.py LOCK getText assert defused')

          # ---- lib/dvb/dvb.cpp + dvb.h：主线下核 C++ 前端注册 ----
          # 上游 C++ 资源管理器只注册 adapter0；adapter1..N 仅当 isusb()
          # 时走 eDVBUsbAdapter vtuner 桥，而该桥第一步就 open
          # /proc/bus/nim_sockets，失败即放弃（也没有 /dev/vtunerN）。
          # 盒子实测：histb-dmx 每个前端一个平台 adapter（0-3），
          # USB HD2312 为 adapter4 → C++ 只注册了 1 个前端，
          # allocateRawChannel(4) 失败 → "无法运行频道扫描"（2026-10-30）。
          # 修复：adapter0 先注册，其余 adapter 按序直接注册（有 vtuner
          # 基础设施时仍走原桥）；scanDevices 加 fe_base 基址保证
          # eDVBFrontend slotid 全局唯一且与 feid / NimManager 一致。
          p = 'lib/dvb/dvb.h'
          s = open(p).read()
          old = '\tvoid scanDevices();\n'
          new = '\tvoid scanDevices(int fe_base = 0);\n'
          if old in s:
              open(p, 'w').write(s.replace(old, new, 1))
          elif 'scanDevices(int fe_base' in s:
              print('dvb.h already patched')
          else:
              raise SystemExit('dvb.h scanDevices anchor not found - upstream changed, review needed')
          print('dvb.h scanDevices(fe_base) patched')

          p = 'lib/dvb/dvb.cpp'
          s = open(p).read()
          old = ('\tint num_adapter = 1;\n'
                 '\twhile (eDVBAdapterLinux::exist(num_adapter))\n'
                 '\t{\n'
                 '\t\tif (eDVBAdapterLinux::isusb(num_adapter))\n'
                 '\t\t{\n'
                 '\t\t\teDVBAdapterLinux *adapter = new eDVBUsbAdapter(num_adapter);\n'
                 '\t\t\taddAdapter(adapter);\n'
                 '\t\t}\n'
                 '\t\tnum_adapter++;\n'
                 '\t}\n'
                 '\n'
                 '\n'
                 '\tif (eDVBAdapterLinux::exist(0))\n'
                 '\t{\n'
                 '\t\teDVBAdapterLinux *adapter = new eDVBAdapterLinux(0);\n'
                 '\t\tadapter->scanDevices();\n'
                 '\t\taddAdapter(adapter, true);\n'
                 '\t}\n')
          new = ('\tif (eDVBAdapterLinux::exist(0))\n'
                 '\t{\n'
                 '\t\teDVBAdapterLinux *adapter = new eDVBAdapterLinux(0);\n'
                 '\t\tadapter->scanDevices();\n'
                 '\t\taddAdapter(adapter, true);\n'
                 '\t}\n'
                 '\n'
                 '\t/*\n'
                 '\t * DVBIP-1002 mainline kernel: histb-dmx registers one adapter\n'
                 '\t * per frontend (platform subsystem, not usb) and there is no OE\n'
                 '\t * vtuner infrastructure (/proc/bus/nim_sockets, /dev/vtunerN).\n'
                 '\t * Upstream only registers adapter0 and routes every other\n'
                 '\t * adapter through the eDVBUsbAdapter vtuner bridge, which bails\n'
                 '\t * out without those files - leaving all adapters beyond 0\n'
                 '\t * unregistered (allocateRawChannel failures on every tuner but\n'
                 '\t * A). Register every adapter directly in ascending order so the\n'
                 '\t * resource-manager frontend index (feid) and eDVBFrontend slot\n'
                 '\t * ids stay 1:1 with the adapter numbers and NimManager; fall\n'
                 '\t * back to the vtuner bridge only when its infrastructure exists.\n'
                 '\t */\n'
                 '\tint num_adapter = 1;\n'
                 '\tint fe_base = eDVBAdapterLinux::exist(0) ? 1 : 0;\n'
                 '\twhile (eDVBAdapterLinux::exist(num_adapter))\n'
                 '\t{\n'
                 '\t\teDVBAdapterLinux *adapter;\n'
                 '\t\tif (eDVBAdapterLinux::isusb(num_adapter)\n'
                 '\t\t\t&& access("/proc/bus/nim_sockets", R_OK) == 0\n'
                 '\t\t\t&& (access("/dev/vtuner0", F_OK) == 0 || access("/dev/misc/vtuner0", F_OK) == 0))\n'
                 '\t\t{\n'
                 '\t\t\tadapter = new eDVBUsbAdapter(num_adapter);\n'
                 '\t\t}\n'
                 '\t\telse\n'
                 '\t\t{\n'
                 '\t\t\tadapter = new eDVBAdapterLinux(num_adapter);\n'
                 '\t\t\tadapter->scanDevices(fe_base);\n'
                 '\t\t\tfe_base += adapter->getNumFrontends();\n'
                 '\t\t}\n'
                 '\t\taddAdapter(adapter);\n'
                 '\t\tnum_adapter++;\n'
                 '\t}\n')
          if old in s:
              s = s.replace(old, new, 1)
          elif 'DVBIP-1002 mainline kernel: histb-dmx registers one adapter' in s:
              print('dvb.cpp adapter registration already patched')
          else:
              raise SystemExit('dvb.cpp adapter loop anchor not found - upstream changed, review needed')
          old = 'void eDVBAdapterLinux::scanDevices()\n'
          new = 'void eDVBAdapterLinux::scanDevices(int fe_base)\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'scanDevices(int fe_base)' in s:
              pass
          else:
              raise SystemExit('dvb.cpp scanDevices anchor not found - upstream changed, review needed')
          old = '\t\t\tfe = new eDVBFrontend(name.c_str(), num_fe, ok, true);\n'
          new = '\t\t\tfe = new eDVBFrontend(name.c_str(), num_fe + fe_base, ok, true);\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'num_fe + fe_base, ok, true' in s:
              pass
          else:
              raise SystemExit('dvb.cpp simulate frontend anchor not found - upstream changed, review needed')
          old = '\t\t\tfe = new eDVBFrontend(name.c_str(), num_fe, ok, false, fe);\n'
          new = '\t\t\tfe = new eDVBFrontend(name.c_str(), num_fe + fe_base, ok, false, fe);\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'num_fe + fe_base, ok, false' in s:
              pass
          else:
              raise SystemExit('dvb.cpp real frontend anchor not found - upstream changed, review needed')
          open(p, 'w').write(s)
          print('dvb.cpp mainline adapter registration patched')

          # ---- lib/dvb/db.cpp：悬空 bouquet 条目修复 ----
          # loadBouquet() 在检查引用文件是否存在之前就执行
          # m_bouquets[bouquet_name]（operator[] 默认构造空 eBouquet，
          # m_bouquet_name=""）。被引用的 userbouquet 文件缺失时函数
          # return，但空条目已留在 map：① 名字解析
          # （eStaticServiceDVBBouquetInformation::getName）见空名返回 -1，
          # 频道列表直接显示 FROM BOUQUET "xxx" 原文（2026-10-30 盒子实测，
          # bouquets.tv 有 favourites 条目而 userbouquet.favourites.tv
          # 缺失）；② reloadBouquets() 的 favourites 自动补建分支因
          # find() 命中空条目而永不执行，文件永远补不上。修复：未找到
          # 文件时 erase 掉 operator[] 产生的空条目，让补建逻辑生效。
          p = 'lib/dvb/db.cpp'
          s = open(p).read()
          old = ('eDebug("[eDVBDB] Error: Can\'t load bouquet \'%s\'!", path);\n'
                 '\t\t\t\treturn;\n')
          new = ('eDebug("[eDVBDB] Error: Can\'t load bouquet \'%s\'!", path);\n'
                 '\t\t\t\tm_bouquets.erase(bouquet_name);\n'
                 '\t\t\t\treturn;\n')
          if old in s:
              s = s.replace(old, new, 1)
          elif 'm_bouquets.erase(bouquet_name)' in s:
              pass
          else:
              raise SystemExit('db.cpp missing-bouquet anchor not found - upstream changed, review needed')
          open(p, 'w').write(s)
          print('db.cpp dangling bouquet entry fixed')

          # ---- lib/dvb/demux.cpp：DMX_SET_SOURCE 失败也记录 source ----
          # histb-dmx 不实现 DMX_SET_SOURCE（该 ioctl 内核 4.14+ 已从主线
          # 移除，openatv 只给 UAPI 打了 shim，驱动没有实现 → ENOTTY）。
          # setSourceFrontend() 仅在 ioctl 成功时置 source=fenum，失败时
          # source 保持 -1；allocateDemux() 的占用共享判定要求
          # getSource()==前端 DVBID，永远不成立 → 每个 adapter 只有一个
          # demux 且已被同频道的 cap=00（数据 demux）占住，cap=01（解码
          # demux）共享失败 → "no free demux found"，所有调谐器直播无法
          # 起播（2026-10-30 盒子 8922 会话实测：09:45:05 cap=00 成功 +
          # DMX_SET_SOURCE Frontend4 failed，09:45:15 cap=01 no free
          # demux found）。本机每 adapter 一前端一 demux，DMX_SET_SOURCE
          # 的硬件路由本就是空操作，软件记账即可。
          p = 'lib/dvb/demux.cpp'
          s = open(p).read()
          old = ('eDebug("[eDVBDemux] DMX_SET_SOURCE Frontend%d failed: %m", fenum);\n'
                 '\telse\n'
                 '\t\tsource = fenum;\n')
          new = ('eDebug("[eDVBDemux] DMX_SET_SOURCE Frontend%d failed: %m", fenum);\n'
                 '\t/* DVBIP-1002: histb-dmx has no DMX_SET_SOURCE (ENOTTY) and\n'
                 '\t * each adapter has a single frontend and demux, so hardware\n'
                 '\t * source routing is a no-op. Record the source anyway:\n'
                 '\t * allocateDemux() sharing (getSource() == frontend DVBID)\n'
                 '\t * must succeed for live decode-demux allocation on the\n'
                 '\t * single demux of each adapter. */\n'
                 '\tsource = fenum;\n')
          if old in s:
              s = s.replace(old, new, 1)
          elif 'allocateDemux() sharing (getSource() == frontend DVBID)' in s:
              pass
          else:
              raise SystemExit('demux.cpp setSourceFrontend anchor not found - upstream changed, review needed')
          open(p, 'w').write(s)
          print('demux.cpp setSourceFrontend fallback patched')

          # ---- IceTV gotRecordEvent None 防御（2026-10-30 盒子实测）----
          # Navigation.py streamStatusChangedCB() 以 x(None, evStart/evEnd)
          # 通知流媒体起停，IceTV 插件直接 rec_service.getPtrString() →
          # AttributeError: 'NoneType' object has no attribute
          # 'getPtrString'，每次 web 流起停刷 traceback（上游 bug）。
          p = 'lib/python/Plugins/SystemPlugins/IceTV/plugin.py'
          s = open(p).read()
          old = ('        if event not in self.START_EVENTS and event not in self.END_EVENTS and event not in self.ERROR_EVENTS:\n'
                 '            return\n'
                 '\n'
                 '        rec_service_id = rec_service.getPtrString()\n')
          new = ('        if event not in self.START_EVENTS and event not in self.END_EVENTS and event not in self.ERROR_EVENTS:\n'
                 '            return\n'
                 '\n'
                 '        if rec_service is None:\n'
                 '            # Navigation.streamStatusChangedCB() fires record_event with a\n'
                 '            # NULL service for streaming start/stop. Not a recording job:\n'
                 '            # there is nothing to look up, so just ignore the event.\n'
                 '            return\n'
                 '\n'
                 '        rec_service_id = rec_service.getPtrString()\n')
          if old in s:
              s = s.replace(old, new, 1)
          elif 'rec_service is None' in s:
              pass
          else:
              raise SystemExit('IceTV plugin.py gotRecordEvent anchor not found - upstream changed, review needed')
          open(p, 'w').write(s)
          print('IceTV plugin.py gotRecordEvent None-guard patched')

          # ---- /proc/stb → /var/stb（2026-10-30 盒子实测）----
          # histb 内核栈不提供传统 STB 的 /proc/stb procfs 树，eAVControl
          # 每次取分辨率/宽高比都刷 "Unable to open file
          # '/proc/stb/vmpeg/0/xres'"（单次换台 60+ 行），写画面位置
          # dst_* 同样失败。/proc 是 procfs，用户态无法在其下创建目录，
          # fake 树挂载方案不可行，因此把全仓 C++/Python 的路径前缀
          # 统一重定向到 /var/stb；deb 自带预填默认值的同名文件树
          # （见打包段），日志静音，后续 decoder backend 可直接写真实
          # 状态。纯路径字符串替换，不触碰任何逻辑。
          import subprocess
          r = subprocess.run(['grep', '-rl', '/proc/stb', 'lib', 'main'],
                             capture_output=True, text=True)
          nfiles = 0
          for f in r.stdout.split():
              s = open(f).read()
              if '/proc/stb' in s:
                  open(f, 'w').write(s.replace('/proc/stb', '/var/stb'))
                  nfiles += 1
          print('proc-stb redirect applied to %d files' % nfiles)
          EOF

      # ---- histb 软件 decoder backend（2026-10-30）----
      # histb 内核栈没有 DVB video/audio decoder 设备节点
      # (/dev/dvb/adapterN/{video,audio}0)，直播解码走：
      #   demux PES tap -> 用户态 TS/PES 拆包 -> hivxe-ffmpeg
      #   (v4l2request hwaccel: AVS+/CAVS, H264, HEVC, MPEG2)
      #   -> DRM_PRIME dmabuf -> histb-vdp DRM overlay plane
      # 音频 -> avcodec (MP2/AAC/AC3/DTS/EAC3) -> swresample -> ALSA。
      # hivxe-ffmpeg 头取自 HiSilicon-Development/FFmpeg fork（与
      # extra 安装件的 avcodec 63.1.101 同源），运行时 dlopen 不硬链接。
      - name: Patch histb decoder backend
        run: |
          python3 << 'EOF'
          import shutil
          shutil.copy('packaging/decoder_histb_impl.h', 'enigma2/lib/dvb/decoder_histb_impl.h')

          p = 'enigma2/lib/dvb/decoder.h'
          s = open(p).read()
          old = 'int m_fd, m_fd_demux, m_dev, m_is_freezed, m_bypass;'
          assert s.count(old) == 1, 'eDVBAudio pimpl anchor'
          s = s.replace(old, old + '\n\tvoid *m_histb = nullptr;', 1)
          old = 'int m_fd, m_fd_demux, m_dev;'
          assert s.count(old) == 1, 'eDVBVideo pimpl anchor'
          s = s.replace(old, old + '\n\tvoid *m_histb = nullptr;', 1)
          old = 'int m_fd_demux, m_dev;'
          assert s.count(old) == 2, 'eDVBPCR/eDVBTText pimpl anchor'
          s = s.replace(old, old + '\n\tvoid *m_histb = nullptr;')
          open(p, 'w').write(s)
          print('decoder.h pimpl members added')

          p = 'enigma2/lib/dvb/decoder.cpp'
          s = open(p).read()
          old = 'DEFINE_REF(eDVBAudio);'
          assert s.count(old) == 1
          s = s.replace(old,
              '#ifdef HAVE_HISTB\n'
              '#include <lib/dvb/decoder_histb_impl.h>\n'
              '#else\n' + old, 1)
          old = 'DEFINE_REF(eTSMPEGDecoder);'
          assert s.count(old) == 1
          s = s.replace(old,
              '#endif /* HAVE_HISTB */\n\n' + old, 1)
          # The #ifdef/#else span excludes the file-scope VIDEO_STREAMTYPE_*
          # defines (needed by eTSMPEGDecoder below); relocate the block above
          # the sandwich so both build paths see it.
          start_anchor = '// not finally values i think.. !!'
          assert s.count(start_anchor) == 1, 'streamtype comment anchor'
          i0 = s.index(start_anchor)
          j = s.index('#define VIDEO_STREAMTYPE_AVS2', i0)
          i1 = s.index('#endif', j) + len('#endif')
          i1 = s.index('\n', i1) + 1
          block = s[i0:i1]
          s = s[:i0] + s[i1:]
          anchor = '#ifdef HAVE_HISTB\n#include <lib/dvb/decoder_histb_impl.h>'
          assert s.count(anchor) == 1, 'histb include anchor'
          s = s.replace(anchor, block + '\n' + anchor, 1)
          depth = 0
          for line in s.split('\n'):
              st = line.strip()
              if st.startswith('#ifdef') or st.startswith('#ifndef') or st.startswith('#if '):
                  depth += 1
              elif st.startswith('#endif'):
                  depth -= 1
          assert depth == 0, 'unbalanced ifdefs depth %d' % depth
          open(p, 'w').write(s)
          print('decoder.cpp histb backend wired')
          EOF

      - name: Prepare hivxe-ffmpeg headers
        run: |
          git clone --depth 1 https://github.com/HiSilicon-Development/FFmpeg.git /tmp/hivxe-ff
          mkdir -p /tmp/hivxe-ff-include/libavcodec /tmp/hivxe-ff-include/libavutil /tmp/hivxe-ff-include/libswresample /tmp/hivxe-ff-include/libswscale
          cp /tmp/hivxe-ff/libavcodec/*.h /tmp/hivxe-ff-include/libavcodec/
          cp /tmp/hivxe-ff/libavutil/*.h /tmp/hivxe-ff-include/libavutil/
          cp /tmp/hivxe-ff/libswresample/*.h /tmp/hivxe-ff-include/libswresample/
          cp /tmp/hivxe-ff/libswscale/*.h /tmp/hivxe-ff-include/libswscale/
          # 生成头（configure 产物）：arm64 little-endian 固定模板
          cat > /tmp/hivxe-ff-include/libavutil/avconfig.h << 'EOF'
          #ifndef AVUTIL_AVCONFIG_H
          #define AVUTIL_AVCONFIG_H
          #define AV_HAVE_BIGENDIAN 0
          #define AV_HAVE_FAST_UNALIGNED 1
          #endif
          EOF
          cat > /tmp/hivxe-ff-include/libavutil/ffversion.h << 'EOF'
          #ifndef AVUTIL_FFVERSION_H
          #define AVUTIL_FFVERSION_H
          #define FFMPEG_VERSION "hivxe-63.1.101"
          #endif
          EOF
          echo "hivxe-ffmpeg headers ready"

      - name: Configure
        run: |
          cd enigma2
          ./autogen.sh
          # OE-A 魔改版 ax_python_devel 的路径 sed hack 会污染 Debian multiarch 路径，
          # 预置 PYTHON_CPPFLAGS/PYTHON_LIBS 跳过其自动检测；用自带的 Python 3.13
          # HAVE_HISTB: histb 软件 decoder backend（dlopen hivxe-ffmpeg，不硬链接）
          # -I/usr/include/libdrm: xf86drm.h（/usr/include 顶层）内部 #include <drm.h>，
          # Debian libdrm-dev 把内核 DRM 头装在 /usr/include/libdrm/（非 /usr/include/drm/）
          CPPFLAGS="-DHAVE_HISTB -I/tmp/hivxe-ff-include -I/usr/include/libdrm" \
          LIBS="-lasound -ldrm -ldl" \
          PYTHON_CPPFLAGS="-I/usr/local/include/python3.13" \
          PYTHON_LIBS="-L/usr/local/lib -lpython3.13" \
          ./configure \
            --with-gstversion=1.0 \
            --with-boxtype=${BOXTYPE} \
            --with-machinebuild=${MACHINEBUILD} \
            --with-e2rev=${E2VER}

      - name: Build
        run: |
          cd enigma2
          make -j$(nproc)

      - name: Build socketdaemon
        run: |
          # openatv NetworkManager(2025+) 的链路状态数据源：socketdaemon
          # 监听 rtnetlink + ethtool ioctl，写 /var/run/netinfo 和
          # daemon_net.socket。主线内核盒子没有 OE 厂商层提供该 daemon，
          # 不带它 NetworkManager 的 netInfo.link 恒 False → UI 一律显示
          # “网线未连接”（2026-10-30 盒子实测，实际网络正常）。
          # 单文件 C 程序，仅依赖 pthread，arm64 runner 原生编译。
          git clone --depth 1 https://github.com/openatv/socketdaemon /tmp/socketdaemon
          cd /tmp/socketdaemon
          autoreconf -fi
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install DESTDIR=/tmp/sd-staging
          ls -la /tmp/sd-staging/usr/local/bin/

      - name: Stage install
        run: |
          cd enigma2
          make install DESTDIR=/tmp/e2-staging
          # skin_default 的图标资源（icons/buttons/extensions 等）不在 enigma2
          # 主仓库，OE 由独立包 openatv/oe-alliance-e2-skindefault 提供；
          # 缺失时 Satfinder 锁定图标、CableScan scan-c.png 等全部告警。
          # 只拷资源目录，不覆盖 enigma2 master 的 skin_default.xml。
          git clone --depth 1 https://github.com/openatv/oe-alliance-e2-skindefault /tmp/skindefault
          mkdir -p /tmp/e2-staging/usr/local/share/enigma2/skin_default
          cp -a /tmp/skindefault/skin_default/. /tmp/e2-staging/usr/local/share/enigma2/skin_default/
          find /tmp/e2-staging -maxdepth 3 | head -30

      - name: Package .deb
        run: |
          # 打包到 $GITHUB_WORKSPACE（容器挂载卷），upload-artifact 才能取到

          # ---- 运行库：libdvbsi++ ----
          DVBDIR=$GITHUB_WORKSPACE/.pkg-libdvbsi
          mkdir -p ${DVBDIR}/DEBIAN
          cat > ${DVBDIR}/DEBIAN/control <<EOF
          Package: libdvbsi++
          Version: ${E2VER}
          Architecture: arm64
          Maintainer: manhere <manhere@gmail.com>
          Depends: libstdc++6
          Description: DVB Service Information library (OpenVisionE2, runtime)
           Built natively on Debian 12 arm64 via GitHub Actions.
          Section: libs
          Priority: optional
          EOF
          dpkg-deb --build --root-owner-group ${DVBDIR} $GITHUB_WORKSPACE/libdvbsi++_${E2VER}_arm64.deb

          # ---- 运行库：libtuxtxt（含 libtuxtxt32bpp）----
          TXTDIR=$GITHUB_WORKSPACE/.pkg-libtuxtxt
          mkdir -p ${TXTDIR}/DEBIAN
          cat > ${TXTDIR}/DEBIAN/control <<EOF
          Package: libtuxtxt
          Version: ${E2VER}
          Architecture: arm64
          Maintainer: manhere <manhere@gmail.com>
          Description: Teletext library and 32bpp renderer (oe-alliance, runtime)
           Built natively on Debian 12 arm64 via GitHub Actions.
          Section: libs
          Priority: optional
          EOF
          dpkg-deb --build --root-owner-group ${TXTDIR} $GITHUB_WORKSPACE/libtuxtxt_${E2VER}_arm64.deb

          # ---- enigma2 本体 ----
          PKGDIR=$GITHUB_WORKSPACE/enigma2-hi3798cv200_${E2VER}_arm64
          mkdir -p ${PKGDIR}/DEBIAN
          cp -a /tmp/e2-staging/* ${PKGDIR}/
          # ---- socketdaemon（NetworkManager 链路状态数据源）----
          cp -a /tmp/sd-staging/usr/local/bin/socketdaemon ${PKGDIR}/usr/local/bin/socketdaemon

          # enigma2 启动必需的机器信息文件（OE 构建系统产物，BoxInfo 从这里读
          # machinebuild/socfamily 等；checksum 已按 enigma2 md5 算法生成）
          # 注意：SystemInfo 用 SCOPE_LIBDIR=${libdir}/ 拼路径，实际查找
          # ${libdir}/enigma.info（即 /usr/local/lib/enigma.info），
          # 不是 /usr/local/lib/enigma2/enigma.info（2026-10-29 盒子实测定位）
          cp ${GITHUB_WORKSPACE}/packaging/enigma.info ${PKGDIR}/usr/local/lib/enigma.info

          # ---- 语言包（openATV International 组件的识别机制）----
          # Components/International.py 通过扫描 /var/lib/opkg/info/ 下的
          # enigma2-locale-*.control 文件名生成语言列表（OE 镜像里每种语言
          # 是一个 opkg 包）；没有 control 文件时语言向导只剩内置 en_US。
          # 翻译本体 po/<lang>/LC_MESSAGES/enigma2.mo 由 make install 装到
          # ${pkgdatadir}/po/（/usr/local/share/enigma2/po/），随 staging 一起打包。
          ls ${PKGDIR}/usr/local/share/enigma2/po/ | head -8 || true
          # 只保留 英语/简体中文/繁体中文（zh_HK 为繁中），其余语言目录
          # 与 po 根目录散装 .po/.pot 一并裁剪（既满足需求又给包瘦身，
          # 还能消除 installedDirectories/installedPackages 计数不等告警）
          KEEP_LOCALES=" en zh_CN zh_HK "
          for d in ${PKGDIR}/usr/local/share/enigma2/po/*/; do
            lang=$(basename "$d")
            case "${KEEP_LOCALES}" in *" ${lang} "*) ;; *) rm -rf "$d" ;; esac
          done
          find ${PKGDIR}/usr/local/share/enigma2/po -maxdepth 1 -type f -delete
          if [ ! -f ${PKGDIR}/usr/local/share/enigma2/po/zh_CN/LC_MESSAGES/enigma2.mo ]; then
            # 兜底：staging 缺 .mo 时从源码 po 目录现场编译（仅编译保留的三种）
            for lang in en zh_CN zh_HK; do
              [ -f enigma2/po/$lang.po ] || continue
              mkdir -p ${PKGDIR}/usr/local/share/enigma2/po/$lang/LC_MESSAGES
              msgfmt -o ${PKGDIR}/usr/local/share/enigma2/po/$lang/LC_MESSAGES/enigma2.mo "enigma2/po/$lang.po"
            done
          fi
          mkdir -p ${PKGDIR}/var/lib/opkg/info
          for d in ${PKGDIR}/usr/local/share/enigma2/po/*/; do
            lang=$(basename "$d")
            [ -f "$d/LC_MESSAGES/enigma2.mo" ] || continue
            # 包名规则：小写、下划线转连字符（zh_CN -> zh-cn，en_GB -> en-gb），
            # International.packageToLocales 会把 zh-cn 还原为 locale zh_CN
            pkg=$(echo "$lang" | tr 'A-Z_' 'a-z-')
            printf 'Package: enigma2-locale-%s\nVersion: %s\nArchitecture: all\nMaintainer: manhere <manhere@gmail.com>\nDescription: enigma2 locale %s\n' \
              "$pkg" "${E2VER}" "$lang" \
              > ${PKGDIR}/var/lib/opkg/info/enigma2-locale-${pkg}.control
          done
          echo "locale packages: $(ls ${PKGDIR}/var/lib/opkg/info | wc -l)"
          ls ${PKGDIR}/var/lib/opkg/info | head -8

          # ---- 频率表（OE 发行层文件，enigma2 仓库不含）----
          # C++ db.cpp 硬编码 /etc/enigma2/*.xml（我们已把 /etc/enigma2 符号
          # 链接到 /usr/local/etc/enigma2）。缺失时 cablesList 为空，DVB-C
          # 搜台界面 ScanSetup 读 scan_provider.index 直接 IndexError
          # （2026-10-30 盒子实测）；satellites.xml 缺失则无法配置/搜索卫星。
          git clone --depth 1 https://github.com/oe-alliance/oe-alliance-tuxbox-common /tmp/tuxbox-common
          mkdir -p ${PKGDIR}/usr/local/etc/enigma2
          for x in satellites cables terrestrial atsc; do
            cp -f /tmp/tuxbox-common/src/$x.xml ${PKGDIR}/usr/local/etc/enigma2/$x.xml
          done
          # Components/Timezones.py 硬编码 /etc/timezone.xml
          mkdir -p ${PKGDIR}/etc
          cp -f /tmp/tuxbox-common/src/timezone.xml ${PKGDIR}/etc/timezone.xml

          # ---- OE 发行层 Python 模块（enigma2 源码 import 但不在仓库内）----
          # Tools/Weatherinfo.py：MyMetrixLite 皮肤插件依赖，缺失即插件加载失败
          git clone --depth 1 https://github.com/openatv/WeatherInfo /tmp/WeatherInfo
          mkdir -p ${PKGDIR}/usr/local/lib/enigma2/python/Tools
          cp -f /tmp/WeatherInfo/Weatherinfo.py ${PKGDIR}/usr/local/lib/enigma2/python/Tools/Weatherinfo.py
          # process.py：Screens/NetworkServices.py "from process import ProcessList"
          # （OE python3-process 包，缺失时进程列表入口崩溃）
          curl -sf -o ${PKGDIR}/usr/local/lib/enigma2/python/process.py \
            https://raw.githubusercontent.com/oe-alliance/oe-alliance-core/master/meta-oe/recipes-devtools/python/python3-process/process.py
          ls -la ${PKGDIR}/usr/local/etc/enigma2/*.xml ${PKGDIR}/etc/timezone.xml \
                 ${PKGDIR}/usr/local/lib/enigma2/python/Tools/Weatherinfo.py \
                 ${PKGDIR}/usr/local/lib/enigma2/python/process.py

          # ---- 内嵌 Python 3.13 运行时（libpython + stdlib + twisted）----
          mkdir -p ${PKGDIR}/usr/local/lib ${PKGDIR}/etc/ld.so.conf.d
          cp -a /usr/local/lib/libpython3.13.so* ${PKGDIR}/usr/local/lib/
          cp -a /usr/local/lib/python3.13 ${PKGDIR}/usr/local/lib/
          # python3.13 解释器本体（enigma2 内嵌 libpython 能跑，但盒子端
          # 无解释器无法做诊断/解包；一起打包）
          mkdir -p ${PKGDIR}/usr/local/bin
          cp -a /usr/local/bin/python3.13 ${PKGDIR}/usr/local/bin/python3.13
          # enigma2 裸二进制改为 .bin + 同名管理脚本（OE enigma2.sh 语义）：
          # 设置界面“重启 E2”调 quitMainloop(3) 后进程直接退出，必须由
          # 外层循环按退出码拉起（Screens/Standby.py: 1=关机 2=整机重启
          # 3=重启UI 5=出错重启 15/16/17=Kodi等 42-44=升级 45=WOL关机）；
          # 关机/重启同样由退出码驱动。
          mv ${PKGDIR}/usr/local/bin/enigma2 ${PKGDIR}/usr/local/bin/enigma2.bin
          cat > ${PKGDIR}/usr/local/bin/enigma2 <<'SH'
          #!/bin/sh
          # OE enigma2.sh equivalent: UI supervisor loop driven by
          # quitMainloop exit codes (Screens/Standby.py QUIT_*).
          BIN=/usr/local/bin/enigma2.bin
          # NetworkManager 的 /var/run/netinfo 数据源（链路/网速/流量/因特网
          # 检测），E2 启动前拉起；daemon 自身绑定固定 socket，重复启动
          # 会自行退出，无重复实例风险。
          start-stop-daemon -S -b -x /usr/local/bin/socketdaemon 2>/dev/null
          while :; do
              ${BIN} "$@"
              ret=$?
              case $ret in
                  1|45)                    # QUIT_SHUTDOWN / QUIT_WOLSHUTDOWN
                      poweroff 2>/dev/null || halt
                      break
                      ;;
                  2)                       # QUIT_REBOOT
                      reboot
                      break
                      ;;
                  3|5|6|15|16|17|42|43|44) # restart UI variants incl. error restart
                      ;;
                  *)                       # clean/unknown exit: leave it dead
                      break
                      ;;
              esac
          done
          start-stop-daemon -K -x /usr/local/bin/socketdaemon 2>/dev/null
          SH
          chmod 755 ${PKGDIR}/usr/local/bin/enigma2
          # 瘦身：测试套件/构建配置/备件不需要
          rm -rf ${PKGDIR}/usr/local/lib/python3.13/test \
                 ${PKGDIR}/usr/local/lib/python3.13/idlelib \
                 ${PKGDIR}/usr/local/lib/python3.13/config-3.13* \
                 ${PKGDIR}/usr/local/lib/python3.13/lib-dynload/*_tkit* \
                 ${PKGDIR}/usr/local/lib/python3.13/site-packages/pip \
                 ${PKGDIR}/usr/local/lib/python3.13/site-packages/setuptools \
                 ${PKGDIR}/usr/local/lib/python3.13/site-packages/pkg_resources
          # enigma2 运行期依赖：twisted[tls]（含 pyopenssl/service_identity/idna
          # 等 TLS 全链，Tools/Downloader.py 需要）+ pyusb
          # （StartEnigma.py: from usb.backend.libusb1 import get_backend）
          # + CT3（OpenWebif Cheetah 模板）
          # + pillow（皮肤渲染器 MetrixHDXPicon: from PIL import Image）
          # + requests（Tools/Weatherinfo.py MSN 天气：from requests import get）
          /usr/local/bin/python3.13 -m pip install -q --target \
            ${PKGDIR}/usr/local/lib/python3.13/site-packages "twisted[tls]" pyusb CT3 pillow requests
          find ${PKGDIR}/usr/local/lib/python3.13/site-packages -maxdepth 1 -mindepth 1 | head
          # libpython3.13 的动态链接查找路径
          echo "/usr/local/lib" > ${PKGDIR}/etc/ld.so.conf.d/enigma2-python.conf

          # ---- MetrixHD 默认皮肤（openATV 官方 skin 包）----
          # skin.py DEFAULT_SKIN=MetrixHD/skin.xml，缺失时 emergency skin
          # （skin_default/skin.xml，OE 发行层产物）也不存在 → dirname(None) 崩溃
          git clone --depth 1 https://github.com/openatv/MetrixHD /tmp/MetrixHD
          mkdir -p ${PKGDIR}/usr/local/share/enigma2 ${PKGDIR}/usr/local/lib/enigma2/python
          cp -a /tmp/MetrixHD/usr/share/enigma2/MetrixHD ${PKGDIR}/usr/local/share/enigma2/
          cp -a /tmp/MetrixHD/usr/lib/enigma2/python/Components ${PKGDIR}/usr/local/lib/enigma2/python/
          cp -a /tmp/MetrixHD/usr/lib/enigma2/python/Plugins ${PKGDIR}/usr/local/lib/enigma2/python/

          # ---- OpenWebif（浏览器控制台：虚拟遥控器/频道管理/全部设置）----
          # oe-alliance/OpenWebif 2.x（openATV 实际使用的 fork），纯 Python 插件，
          # plugin/ 整目录平移到 Plugins/Extensions/OpenWebif 即完成安装；
          # WHERE_SESSIONSTART 自动起 Web 服务（默认 80 端口）。
          # 运行期依赖：twisted/pyOpenSSL（已带）+ Cheetah（上方 pip 已装 CT3 fork）
          git clone --depth 1 https://github.com/oe-alliance/OpenWebif /tmp/OpenWebif
          OWIFDIR=${PKGDIR}/usr/local/lib/enigma2/python/Plugins/Extensions/OpenWebif
          mkdir -p ${OWIFDIR}
          cp -a /tmp/OpenWebif/plugin/. ${OWIFDIR}/
          # 翻译：locale/*.po -> plugin/locale/<lang>/LC_MESSAGES/OpenWebif.mo（domain 固定 OpenWebif）
          for p in /tmp/OpenWebif/locale/*.po; do
            lang=$(basename "$p" .po)
            mkdir -p ${OWIFDIR}/locale/$lang/LC_MESSAGES
            msgfmt -o ${OWIFDIR}/locale/$lang/LC_MESSAGES/OpenWebif.mo "$p"
          done
          echo "OpenWebif files: $(find ${OWIFDIR} -type f | wc -l)"
          # 皮肤 XML 内 6 处硬编码 /usr/share/enigma2/MetrixHD → 符号链接兜底

          # ---- tuxtxt 字体（皮肤引用 /usr/share/fonts/tuxtxt.ttf，缺失报
          # [Skin] Error: Tag 'font' needs an existing filename）----
          mkdir -p ${PKGDIR}/usr/share/fonts
          cp -f /tmp/tuxtxt/tuxtxt/font/tuxtxt.ttf ${PKGDIR}/usr/share/fonts/tuxtxt.ttf

          # ---- VDEC 解码固件（histb-vdec 内核驱动 request_firmware）----
          #   histb-avsp.bin        AVS/AVS+ SCD 机器程序（17920B，
          #                         HiVXE-2.0 官方重构件，源 HiSTB
          #                         vfmw_v5.0 product Hi3798CV200 scd_drv.S
          #                         g_avsp_firmware，sha256 4ec0ea0b...）
          #   histb-h264-cabac.bin  H.264 CABAC 表（5120B，vfmw
          #                         vdm_hal_h264.S H264HAL_V4R3C1_InitHal
          #                         原样 memcpy 的 g_CabacMN 提取）
          #   histb-hevc-cabac.bin  HEVC CABAC 表（928B=464 entries，
          #                         vfmw vdm_hal_hevc.S HEVCWriteCabacTab
          #                         运行时由 s_InitValue 按 HEVC 规范
          #                         m=slope*5-45 / n=(offset<<3)-16 变换
          #                         后 16bit 字节交换写入，本 bin 为
          #                         同一变换的离线重构）
          # 固件缺失时对应格式解码请求直接失败（AVS/AVS+ 台全黑）。
          mkdir -p ${PKGDIR}/lib/firmware/hisilicon
          cp ${GITHUB_WORKSPACE}/packaging/firmware/hisilicon/*.bin ${PKGDIR}/lib/firmware/hisilicon/

          # ---- fake /var/stb 文件树（配合源码 /proc/stb → /var/stb 重定向）----
          # 数值节点全部 hex 文本（CFile::parseIntHex 解析）：
          #   xres=1920(780) yres=1080(438) framerate=50(32) aspect=1(16:9)
          # dst_* 为画面定位写入目标，初值任意（E2 会重写）。
          mkdir -p ${PKGDIR}/var/stb/vmpeg/0 ${PKGDIR}/var/stb/video ${PKGDIR}/var/stb/avs/0
          printf 780 > ${PKGDIR}/var/stb/vmpeg/0/xres
          printf 438 > ${PKGDIR}/var/stb/vmpeg/0/yres
          printf 1 > ${PKGDIR}/var/stb/vmpeg/0/aspect
          printf 32 > ${PKGDIR}/var/stb/vmpeg/0/framerate
          printf 32 > ${PKGDIR}/var/stb/vmpeg/0/fallback_framerate
          printf 1 > ${PKGDIR}/var/stb/vmpeg/0/progressive
          printf 0 > ${PKGDIR}/var/stb/vmpeg/0/dst_top
          printf 0 > ${PKGDIR}/var/stb/vmpeg/0/dst_left
          printf 500 > ${PKGDIR}/var/stb/vmpeg/0/dst_width
          printf 2d0 > ${PKGDIR}/var/stb/vmpeg/0/dst_height
          printf 0 > ${PKGDIR}/var/stb/vmpeg/0/dst_apply
          printf ff > ${PKGDIR}/var/stb/video/alpha
          printf 1 > ${PKGDIR}/var/stb/video/aspect
          printf bestfit > ${PKGDIR}/var/stb/video/policy
          printf bestfit > ${PKGDIR}/var/stb/video/policy2
          printf bestfit > ${PKGDIR}/var/stb/video/policy_choices
          printf 720p50 > ${PKGDIR}/var/stb/video/videomode
          printf 720p50 > ${PKGDIR}/var/stb/video/videomode_50hz
          printf 720p24 > ${PKGDIR}/var/stb/video/videomode_24hz
          printf 720p60 > ${PKGDIR}/var/stb/video/videomode_60hz
          printf '720p50 720p25 1080i50 1080p50 2160p50\n' > ${PKGDIR}/var/stb/video/videomode_choices
          printf encoder > ${PKGDIR}/var/stb/avs/0/input
          printf encoder > ${PKGDIR}/var/stb/avs/0/input_choices
          printf Hdmi > ${PKGDIR}/var/stb/avs/0/colorformat

          # ---- systemd 开机自启单元 ----
          # enigma2 必须经 supervisor wrapper（/usr/local/bin/enigma2）启动，
          # 它承担 OE enigma2.sh 的退出码语义（重启UI/关机/重启）。
          # ExecStartPre 等 /dev/dvb 就绪，规避开机竞态；Restart=always 兜底
          # wrapper 对未知退出码的主动退出。
          mkdir -p ${PKGDIR}/etc/systemd/system
          cat > ${PKGDIR}/etc/systemd/system/e2.service <<'UNIT'
          [Unit]
          Description=enigma2 (OpenATV port for Hi3798CV200)
          After=multi-user.target network.target systemd-udevd.service
          Wants=network.target

          [Service]
          Type=simple
          ExecStartPre=/bin/sh -c 'i=0; until [ -e /dev/dvb/adapter0/frontend0 ] || [ $i -ge 30 ]; do sleep 1; i=$((i+1)); done'
          ExecStart=/usr/local/bin/enigma2
          Restart=always
          RestartSec=5
          Environment=HOME=/root

          [Install]
          WantedBy=multi-user.target
          UNIT

          cat > ${PKGDIR}/DEBIAN/postinst <<'SH'
          #!/bin/sh
          set -e
          ldconfig
          # enigma2 假定 OE 镜像的 opkg 包管理布局（International/SystemInfo 等直接列目录），
          # Debian 是 dpkg——补空目录消除启动 FileNotFoundError
          mkdir -p /var/lib/opkg/info /var/lib/opkg/lists /etc/opkg
          # 皮肤/插件大量硬编码 /usr/share/enigma2（MetrixHD skin.xml 6 处、
          # OpenWebif root.py/defaults.py 等）——整目录符号链接一次覆盖
          if [ ! -L /usr/share/enigma2 ]; then
            rm -rf /usr/share/enigma2
            ln -sfn /usr/local/share/enigma2 /usr/share/enigma2
          fi
          # 上游 Python 源码同样硬编码 /etc/enigma2/（ChannelSelection.py:1479
          # listdir("/etc/enigma2/")、resumepoints.pkl、epg.dat 等）——
          # 链到真实配置目录（--prefix=/usr/local → sysconfdir 偏差一次纠正）
          if [ ! -L /etc/enigma2 ]; then
            rm -rf /etc/enigma2
            ln -sfn /usr/local/etc/enigma2 /etc/enigma2
          fi
          # 中国大陆 DVB-C 的 SDT/EPG 文本多为 GB2312/GBK 且不带 DVB 编码首字节，
          # enigma2 默认按 Latin-1/ISO6937 解释 → 中文名乱码（scan.cpp:1937 服务名
          # 转换只认 encoding.conf 的转发器映射和 "*" 全局默认，不走国家码映射）。
          # "* GB18030" 行把 defaultEncodingTable 设为 GB18030，仅当 SI 无编码
          # 首字节时生效，不影响自带 UTF-8/其他编码声明的流。
          if [ ! -f /usr/local/etc/enigma2/encoding.conf ]; then
            printf '* GB18030\n' > /usr/local/etc/enigma2/encoding.conf
          fi
          # 预置默认 favourites bouquet：OE 镜像由 defaults 包提供，本包此前
          # 不带 → bouquets.tv 里的 FROM BOUQUET "userbouquet.favourites.tv"
          # 条目指向缺失文件，名字解析失败后频道列表直接显示引用原文
          # （2026-10-30 盒子实测）。幂等：不覆盖用户已有文件。
          if [ ! -f /usr/local/etc/enigma2/userbouquet.favourites.tv ]; then
            printf '#NAME Favourites (TV)\n' > /usr/local/etc/enigma2/userbouquet.favourites.tv
          fi
          if [ ! -f /usr/local/etc/enigma2/userbouquet.favourites.radio ]; then
            printf '#NAME Favourites (Radio)\n' > /usr/local/etc/enigma2/userbouquet.favourites.radio
          fi
          # UsageConfig 启动时写 /etc/tuxtxt/tuxtxt2.conf（tuxtxt 字幕配置）
          mkdir -p /etc/tuxtxt
          # 开机自启：enable 幂等（离线建 symlink，无需 systemd 运行中）
          systemctl enable e2.service 2>/dev/null || true
          SH
          chmod 755 ${PKGDIR}/DEBIAN/postinst

          cat > ${PKGDIR}/DEBIAN/control <<EOF
          Package: enigma2-hi3798cv200
          Version: ${E2VER}
          Architecture: arm64
          Maintainer: manhere <manhere@gmail.com>
          Depends: gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-libav, libglib2.0-0, libfreetype6, libfribidi0, libsigc++-3.0-0, libdvbsi++, libtuxtxt, libavahi-client3, libwebp7, libgif7, libswscale6, zlib1g, libbz2-1.0, liblzma5, libffi8, libreadline8, libsqlite3-0, libncursesw6, libuuid1
          Description: enigma2 (openATV 8.0) for HiSilicon Hi3798CV200 DVBIP-1002
           Built natively on Debian 12 arm64 via GitHub Actions.
          Section: video
          Priority: optional
          EOF
          dpkg-deb --build --root-owner-group ${PKGDIR}
          ls -la ${GITHUB_WORKSPACE}/*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: enigma2-debian12-arm64
          path: |
            enigma2-hi3798cv200*.deb
            libdvbsi++*.deb
            libtuxtxt*.deb
          if-no-files-found: error
