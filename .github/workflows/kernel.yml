name: kernel-dvbip1002

# HiSilicon linux-6.12.y -> Hi3798CV200 DVBIP-1002 内核 + 模块，产出 arm64 .deb
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kernel.yml"
  schedule:
    - cron: "0 3 * * 1" # 每周一 UTC 03:00 跟踪上游 main

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      KSRC: linux
      BASE_DEFCONFIG: hi3798cv200_defconfig   # 完整基座配置（478 行，MODULES/HISTB DVB 驱动）
      FRAGMENT: dvbip_1002_defconfig          # 1002 板差异片段（LOCALVERSION + RTL8211F LED）

    steps:
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev dwarves \
            fakeroot dpkg-dev cpio kmod rsync debhelper build-essential

      - name: Checkout kernel source (HiSilicon-Development/linux-6.12.y)
        uses: actions/checkout@v4
        with:
          repository: HiSilicon-Development/linux-6.12.y
          ref: main
          fetch-depth: 1

      - name: Configure (hi3798cv200 base + dvbip_1002 fragment)
        run: |
          make O=build ARCH=arm64 ${BASE_DEFCONFIG}
          ./scripts/kconfig/merge_config.sh -m -O build build/.config arch/arm64/configs/${FRAGMENT}
          make O=build ARCH=arm64 olddefconfig
          # 打印关键配置便于日志排查
          grep -E "CONFIG_(LOCALVERSION|MODULES|HISTB|DVB_HISTB|MEDIA)" build/.config | head -40

      - name: Build kernel + modules
        run: make O=build ARCH=arm64 -j$(nproc) all

      - name: Build .deb packages
        run: |
          # 版本格式对齐上游 firmware 仓库：6.12.112-YYYYMMDD
          KDEB_PKGVERSION="$(make -s O=build kernelversion)-$(date +%Y%m%d)"
          echo "KDEB_PKGVERSION=$KDEB_PKGVERSION"
          make O=build ARCH=arm64 -j$(nproc) bindeb-pkg \
            KDEB_PKGVERSION=$KDEB_PKGVERSION \
            KDEB_COMPRESS=xz
          # O=build 时 .deb 生成在源码目录（workspace 根）
          ls -la ./*.deb

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dvbip1002-debs
          path: |
            linux-*.deb
          if-no-files-found: error
